<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ui/icon.png" type="image/png">
    <title>ITS TV TIME</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="chat-box">
            <header>
                <h1>QUIZ!!!</h1>
            </header>
            <section class="config">
                <div class="row">
                    <label>分类：</label>
                    <select id="categorySelect">
                        <option value="os">Oneshot</option>
                        <option value="dr">Deltarune</option>
                        <option value="ut">Undertale</option>
                    </select>
                    <label>模式：</label>
                    <select id="modeSelect">
                        <option value="dialogue">台词</option>
                        <option value="music">音乐</option>
                    </select>
                    <button id="startBtn">开始游戏</button>
                </div>
            </section>
            <div class="status-bar">
                <span id="attemptInfo">已猜 0 次</span>
                <span id="hintCount">提示剩余 3 次</span>
                <span id="timer">60s</span>
            </div>
            <section class="game-area">
                <div class="question-box" id="questionBox">
                    <div class="question-content" id="questionContent">
                        <p class="placeholder">点击「开始游戏」启动一局</p>
                    </div>
                    <div id="audioPlayer" style="display:none; margin-top:12px;">
                        <audio id="musicPlayer" style="display:none;"></audio>
                        <button id="playPauseBtn">▶ 播放片段</button>
                        <p class="hint-text" style="margin-top:8px;">播放片段，猜猜是哪首曲子？</p>
                    </div>
                </div>
                <div class="feedback" id="feedback">
                    <div id="feedbackMessage"></div>
                    <div id="hintHistory"></div>
                </div>
            </section>
        </div>
        <div class="input-wrapper">
            <div class="input-area">
                <input type="text" id="answerInput" placeholder="输入你的答案..." disabled>
                <button id="submitBtn" disabled>提交</button>
                <button id="hintBtn" disabled>提示</button>
                <button id="endGameBtn" style="display:none;">结束游戏</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
